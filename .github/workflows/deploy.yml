name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Run tests (unitarios + integracao)
        run: |
          chmod +x mvnw
          ./mvnw test

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::154102274042:role/github-actions-iabill-deploy
          aws-region: sa-east-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          application-name: iabill
          environment-name: Iabill-env
          aws-region: sa-east-1
          version-label: "github-${{ github.sha }}"
          deployment-package-path: backend/target/assistant-0.0.1-SNAPSHOT.jar

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::154102274042:role/github-actions-iabill-deploy
          aws-region: sa-east-1

      - name: Sync to S3 (assets com cache longo, hash no nome garante atualizacao)
        run: aws s3 sync dist/ s3://iabill-frontend --delete --exclude "index.html" --cache-control "public, max-age=31536000, immutable"

      - name: Sync index.html (sem cache - sempre revalida antes de servir)
        run: aws s3 cp dist/index.html s3://iabill-frontend/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E13AQSF9P20W4L --paths "/*"