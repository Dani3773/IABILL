spring:
  application:
    name: assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/lgpd_assistant
    username: lgpd_admin
    password: lgpd_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # nunca deixamos o Hibernate alterar o schema sozinho em nenhum ambiente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug