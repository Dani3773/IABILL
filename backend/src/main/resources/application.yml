spring:
  application:
    name: assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/lgpd_assistant
    username: lgpd_admin
    password: lgpd_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # nunca deixamos o Hibernate alterar o schema sozinho em nenhum ambiente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-troque-isso-em-producao-1234567890abcdef}
    expiration-ms: 86400000  # 24 horas

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: gemini-embedding-001
  embedding-dimension: 768
  generation-model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta